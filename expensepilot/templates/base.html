{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Expense Admin</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f4f6f9;
            margin: 0;
        }

        .sidebar {
            width: 240px;
            min-height: 100vh;
            background: #1f2937;
        }

        .sidebar h4 {
            font-weight: 600;
        }

        .sidebar-link {
            display: block;
            color: #cbd5e1;
            padding: 10px 12px;
            border-radius: 6px;
            text-decoration: none;
            margin-bottom: 5px;
            transition: 0.2s;
        }

        .sidebar-link:hover {
            background-color: #374151;
            color: #ffffff;
        }

        .sidebar-link.active {
            background-color: #2563eb;
            color: #ffffff;
        }

        .main-content {
            background-color: #f4f6f9;
            min-height: 100vh;
        }

        .navbar {
            height: 60px;
        }

        .content-area {
            padding: 30px;
        }
    </style>
</head>
<body>

<div class="d-flex">

    <!-- SIDEBAR -->
    <div class="sidebar p-3">

        <h4 class="text-white mb-4">💰 Expense Admin</h4>

        <a href="{% url 'admin_dashboard' %}" 
           class="sidebar-link {% if request.path == '/admin-dashboard/' %}active{% endif %}">
           Dashboard
        </a>

        <a href="{% url 'admin_user_list' %}" 
           class="sidebar-link {% if 'users' in request.path %}active{% endif %}">
           Users
        </a>

        <a href="{% url 'expense_list' %}" 
           class="sidebar-link {% if 'expenses' in request.path %}active{% endif %}">
           Expenses
        </a>
        <a href="{% url 'monthly_chart' %}" class="sidebar-link">
    Monthly Chart
</a>

<a href="{% url 'yearly_chart' %}" class="sidebar-link">
    Yearly Chart
</a>

        <a href="{% url 'home' %}" class="sidebar-link">
           Home
        </a>

        <a href="/admin/" class="sidebar-link">
           Django Admin
        </a>

    </div>

    <!-- MAIN AREA -->
    <div class="flex-grow-1 main-content">

        <!-- NAVBAR -->
        <nav class="navbar navbar-light bg-white shadow-sm px-4 d-flex justify-content-between">
            <span class="fw-semibold">Admin Panel</span>

            <div>
                <span class="me-3 text-muted">👤 {{ request.user.username }}</span>
                <a href="{% url 'logout' %}" class="btn btn-sm btn-danger">Logout</a>
            </div>
        </nav>

        <!-- PAGE CONTENT -->
        <div class="content-area">
            {% block content %}
            {% endblock %}
        </div>

    </div>

</div>

</body>
</html>
