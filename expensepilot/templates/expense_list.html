{% extends 'base.html' %}

{% block content %}

<h3>Expenses</h3>

<a href="/expenses/add/">Add Expense</a>

<table border="1">

<tr>
<th>User</th>
<th>Title</th>
<th>Amount</th>
<th>Date</th>
<th>Action</th>
</tr>

{% for e in expenses %}

<tr>

<td>{{ e.user.username }}</td>
<td>{{ e.title }}</td>
<td>{{ e.amount }}</td>
<td>{{ e.date }}</td>

<td>

<a href="/expenses/edit/{{e.id}}/">Edit</a>

<a href="/expenses/delete/{{e.id}}/">Delete</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
