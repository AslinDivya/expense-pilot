{% extends 'base.html' %}

{% block content %}

<h2>All Users</h2>

<table class="table">

<tr>
<th>ID</th>
<th>Username</th>
<th>Details</th>
</tr>

{% for u in users %}

<tr>

<td>{{ u.id }}</td>

<td>{{ u.username }}</td>

<td>

<a href="/admin-user/{{u.id}}/" class="btn">View</a>

</td>

</tr>

{% endfor %}

</table>

{% endblock %}
