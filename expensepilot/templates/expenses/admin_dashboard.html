{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Admin Dashboard</h2>

    <!-- SUMMARY CARDS -->
    <div class="row text-center">

        <!-- Total Users -->
        <div class="col-md-3">
            <div class="card shadow p-3">
                <h5>Total Users</h5>
                <h3>{{ total_users }}</h3>
            </div>
        </div>

        <!-- Total Income -->
        <div class="col-md-3">
            <div class="card shadow p-3 bg-success text-white">
                <h5>Total Income</h5>
                <h3>₹ {{ total_income }}</h3>
            </div>
        </div>

        <!-- Total Expenses -->
        <div class="col-md-3">
            <div class="card shadow p-3 bg-danger text-white">
                <h5>Total Expenses</h5>
                <h3>₹ {{ total_expenses }}</h3>
            </div>
        </div>

        <!-- Total Balance -->
        <div class="col-md-3">
            <div class="card shadow p-3 {% if total_balance >= 0 %}bg-primary{% else %}bg-warning{% endif %} text-white">
                <h5>Total Balance</h5>
                <h3>₹ {{ total_balance }}</h3>
            </div>
        </div>

    </div>

    <!-- MANAGE SECTION -->
    <div class="row text-center mt-4">
        <div class="col-md-12">
            <div class="card shadow p-3">
                <h5>Manage</h5>
                <a href="{% url 'expense_list' %}" class="btn btn-primary mt-2">
                    View All Expenses
                </a>
            </div>
        </div>
    </div>

    <!-- CHART SECTION -->
    <div class="row mt-5">
        <div class="col-md-6">
            <h5>Monthly Expenses</h5>
            <canvas id="monthlyChart"></canvas>
        </div>

        <div class="col-md-6">
            <h5>Yearly Expenses</h5>
            <canvas id="yearlyChart"></canvas>
        </div>
    </div>

    <!-- FOOTER BUTTONS -->
    <div class="text-center mt-4">
        <a href="/admin/" class="btn btn-dark">Go to Django Admin Panel</a>
        <a href="{% url 'home' %}" class="btn btn-secondary">Home</a>
    </div>

</div>

<!-- CHART JS -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const userMonthData = JSON.parse('{{ user_month_data|escapejs }}');
const userYearData = JSON.parse('{{ user_year_data|escapejs }}');

// --------------------
// MONTHLY DATA
// --------------------
const monthlyLabels = [
    {% for m in monthly %}
        "{{ m.month|date:'M Y' }}",
    {% endfor %}
];

const monthlyData = [
    {% for m in monthly %}
        {{ m.total }},
    {% endfor %}
];

// MONTHLY CHART
new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
        labels: monthlyLabels,
        datasets: [{
            label: 'Monthly Expenses',
            data: monthlyData,
        }]
    },
    options: {
        responsive: true,
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {

                        const month = context.label;
                        const total = context.raw;

                        let lines = [];

                        if (userMonthData[month]) {
                            userMonthData[month].forEach(function(user) {
                                lines.push(user.username + " - ₹" + user.amount);
                            });
                        }

                        lines.push("Total - ₹" + total);

                        return lines;
                    }
                }
            }
        }
    }
});

// --------------------
// YEARLY DATA
// --------------------
const yearlyLabels = [
    {% for y in yearly %}
        "{{ y.year|date:'Y' }}",
    {% endfor %}
];

const yearlyData = [
    {% for y in yearly %}
        {{ y.total }},
    {% endfor %}
];

// YEARLY CHART
new Chart(document.getElementById('yearlyChart'), {
    type: 'line',
    data: {
        labels: yearlyLabels,
        datasets: [{
            label: 'Yearly Expenses',
            data: yearlyData,
            tension: 0.3,
            fill: false
        }]
    },
    options: {
        responsive: true,
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {

                        const year = context.label;
                        const total = context.raw;

                        let lines = [];

                        if (userYearData[year]) {
                            userYearData[year].forEach(function(user) {
                                lines.push(user.username + " - ₹" + user.amount);
                            });
                        }

                        lines.push("Total - ₹" + total);

                        return lines;
                    }
                }
            }
        }
    }
});
</script>

</body>
</html>
