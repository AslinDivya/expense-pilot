{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container mt-5">
    <h2 class="text-center mb-4">Admin Dashboard</h2>

    <div class="row text-center">

        <!-- Total Users -->
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h4>Total Users</h4>
                <h2>{{ total_users }}</h2>
            </div>
        </div>

        <!-- Total Expenses -->
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h4>Total Expenses</h4>
                <h2>{{ total_expenses }}</h2>
            </div>
        </div>

        <!-- Manage Expenses -->
        <div class="col-md-4">
            <div class="card shadow p-3">
                <h4>Manage</h4>
                <a href="{% url 'expense_list' %}" class="btn btn-primary mt-2">
                    View All Expenses
                </a>
            </div>
        </div>

    </div>

    <!-- Charts Row -->
    <div class="row mt-5">
        <div class="col-md-6">
            <h5>Monthly Expenses</h5>
            <canvas id="monthlyChart"></canvas>
        </div>

        <div class="col-md-6">
            <h5>Yearly Expenses</h5>
            <canvas id="yearlyChart"></canvas>
        </div>
    </div>

    <div class="text-center mt-4">
        <a href="/admin/" class="btn btn-dark">Go to Django Admin Panel</a>
        <a href="{% url 'home' %}" class="btn btn-secondary">Home</a>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
const userMonthData = {{ user_month_data|safe }};

const monthlyLabels = [
    {% for m in monthly %}
        "{{ m.month|date:'M Y' }}",
    {% endfor %}
];

const monthlyData = [
    {% for m in monthly %}
        {{ m.total }},
    {% endfor %}
];

// MONTHLY CHART
new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
        labels: monthlyLabels,
        datasets: [{
            label: 'Monthly Expenses',
            data: monthlyData,
        }]
    },
    options: {
        responsive: true,
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {

                        const month = context.label;
                        const total = context.raw;

                        let lines = [];

                        // Add each user's expense first
                        if (userMonthData[month]) {
                            userMonthData[month].forEach(function(user) {
                                lines.push(user.username + " - ₹" + user.amount);
                            });
                        }

                        // Add total at bottom
                        lines.push("Total - ₹" + total);

                        return lines;
                    }
                }
            }
        }
    }
});
</script>

<script>
const userYearData = {{ user_year_data|safe }};

const yearlyLabels = [
    {% for y in yearly %}
        "{{ y.year|date:'Y' }}",
    {% endfor %}
];

const yearlyData = [
    {% for y in yearly %}
        {{ y.total }},
    {% endfor %}
];

new Chart(document.getElementById('yearlyChart'), {
    type: 'line',   // 🔥 IMPORTANT - Line chart
    data: {
        labels: yearlyLabels,
        datasets: [{
            label: 'Yearly Expenses',
            data: yearlyData,
            tension: 0.3,   // smooth curve
            fill: false
        }]
    },
    options: {
        responsive: true,
        plugins: {
            tooltip: {
                callbacks: {
                    label: function(context) {

                        const year = context.label;
                        const total = context.raw;

                        let lines = [];

                        // Add user wise breakdown
                        if (userYearData[year]) {
                            userYearData[year].forEach(function(user) {
                                lines.push(user.username + " - ₹" + user.amount);
                            });
                        }

                        // Add total at bottom
                        lines.push("Total - ₹" + total);

                        return lines;
                    }
                }
            }
        }
    }
});
</script>



</body>
</html>
