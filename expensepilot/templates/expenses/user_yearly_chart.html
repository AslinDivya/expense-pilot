{% extends "base.html" %}

{% block content %}

<h3 class="mb-4">My Yearly Expense Chart</h3>

<canvas id="yearlyChart"></canvas>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

const labels = {{ labels|safe }};
const values = {{ totals|safe }};

const ctx = document.getElementById('yearlyChart').getContext('2d');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: labels,
        datasets: [{
            label: 'My Yearly Expenses',
            data: values,
            tension: 0.4
        }]
    },
    options: {
        responsive: true
    }
});

</script>

{% endblock %}
