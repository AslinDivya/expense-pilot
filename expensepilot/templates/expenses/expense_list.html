{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Expenses</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<div class="container mt-4">
  <h2>My Expenses</h2>
  <a href="{% url 'expense_add' %}" class="btn btn-success mb-3">+ Add Expense</a>

  <table class="table table-bordered table-striped">
    <tr>
      <th>User</th><th>Date</th><th>Title</th><th>Amount</th><th>Actions</th>
    </tr>
    {% for e in expenses %}
    <tr>
      <td>{{ e.user.username }}</td>
      <td>{{ e.date }}</td>
      <td>{{ e.title }}</td>
      <td>₹ {{ e.amount }}</td>
      <td>
        <a href="{% url 'expense_edit' e.id %}" class="btn btn-sm btn-warning">Edit</a>
        <a href="{% url 'expense_delete' e.id %}" class="btn btn-sm btn-danger">Delete</a>
      </td>
    </tr>
    {% endfor %}
  </table>
  {% if request.user.is_superuser %}
    <a href="{% url 'admin_dashboard' %}" class="btn btn-secondary">Back</a>
{% else %}
    <a href="{% url 'dashboard' %}" class="btn btn-secondary">Back</a>
{% endif %}
  
</div>

</body>
</html>
