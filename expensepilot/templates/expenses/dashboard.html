{% load static %}
<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

<nav class="navbar navbar-dark bg-dark px-3">
  <span class="navbar-brand">Expense Pilot</span>
  <a href="{% url 'logout' %}" class="btn btn-danger">Logout</a>
</nav>

<div class="container mt-4">
  <div class="row">
    <div class="col-md-4">
      <div class="card dashboard-card">
        <h4>Total Expense</h4>
        <h2>₹ {{ total }}</h2>
      </div>
    </div>
  </div>

  <div class="mt-4">
    <a href="{% url 'expense_list' %}" class="btn btn-primary">Manage Expenses</a>
    <a href="{% url 'monthly_chart' %}" class="btn btn-info">Monthly Chart</a>
    <a href="{% url 'yearly_chart' %}" class="btn btn-warning">Yearly Chart</a>
  </div>
</div>

</body>
</html>
