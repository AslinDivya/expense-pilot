{% extends 'base.html' %}

{% block content %}

<style>
.login-container{
    width:380px;
    margin:80px auto;
    background:#ffffff;
    padding:35px;
    border-radius:10px;
    box-shadow:0 6px 18px rgba(0,0,0,0.15);
}

.login-container h2{
    text-align:center;
    margin-bottom:25px;
}

.form-group{
    margin-bottom:18px;
}

.form-group label{
    font-weight:600;
    display:block;
    margin-bottom:5px;
}

.form-group input{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:6px;
    font-size:14px;
}

.form-group input:focus{
    outline:none;
    border-color:#1976d2;
}

.login-btn{
    width:100%;
    padding:12px;
    background:#1976d2;
    border:none;
    color:white;
    font-size:16px;
    border-radius:6px;
    cursor:pointer;
}

.login-btn:hover{
    background:#125aa0;
}

.register-link{
    text-align:center;
    margin-top:15px;
}
</style>

<div class="login-container">

<h2>User Login</h2>

<form method="POST">

{% csrf_token %}

<div class="form-group">
<label>Username</label>
<input type="text" name="username" placeholder="Enter username" required>
</div>

<div class="form-group">
<label>Password</label>
<input type="password" name="password" placeholder="Enter password" required>
</div>

<button type="submit" class="login-btn">Login</button>

</form>

<div class="register-link">
Don't have an account? <a href="{% url 'register' %}">Register</a>
</div>

</div>

{% endblock %}
