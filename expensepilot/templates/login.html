{% extends 'base.html' %}

{% block content %}

<div class="form-box">

<h2>User Login</h2>

<form method="POST">

{% csrf_token %}

<label>Username</label>
<input type="text" name="username" required>

<label>Password</label>
<input type="password" name="password" required>

<button type="submit">Login</button>

</form>

</div>

{% endblock %}
